[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfantastat"
version = "0.3.0"
description = "Italian fantasy football (Fantacalcio) league management library"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openpyxl>=3.1",
]

[project.urls]
Repository = "https://github.com/ggange/pyfantastat"
Issues = "https://github.com/ggange/pyfantastat/issues"

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyfantastat*"]

[tool.setuptools.package-data]
pyfantastat = ["data/calendars/*.npz"]
