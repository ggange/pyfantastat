[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfantastat"
version = "0.3.2"
description = "Italian fantasy football (Fantacalcio) league management library"
license = {text = "MIT"}
authors = [{name = "ggange"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openpyxl>=3.1",
]

[project.urls]
Repository = "https://github.com/ggange/pyfantastat"
Issues = "https://github.com/ggange/pyfantastat/issues"

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7", "pytest-cov"]
notebook = ["pandas>=1.3", "matplotlib>=3.5", "seaborn>=0.12", "jupyter>=1.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyfantastat = ["data/calendars/*.npz"]
